<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Confession Booth - Aprender SQL</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <style>
        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border: 2px solid #444;
            background-color: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
        }

        .overlay-controls {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar (Simplified for this tool) -->
        <div class="bg-glass border-end" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 primary-text fs-4 fw-bold text-uppercase border-bottom">
                <a href="index.html" class="text-decoration-none text-light"><i
                        class="fas fa-arrow-left me-2"></i>Volver</a>
            </div>
            <div class="list-group list-group-flush my-3 px-3">
                <div class="text-center mb-4">
                    <i class="fas fa-church fa-3x text-warning mb-3"></i>
                    <h5 class="text-white">Confesonario SQL</h5>
                    <p class="text-muted small">Para los que olvidaron el WHERE en el DELETE FROM.</p>
                </div>

                <div class="mb-3">
                    <label for="sinnerName" class="form-label text-light">Nombre del Pecador:</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="sinnerName"
                        value="Bernat">
                </div>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-dark bg-glass border-bottom py-3 px-4">
                <div class="d-flex align-items-center">
                    <h2 class="fs-4 m-0">Galería de la Vergüenza</h2>
                </div>
            </nav>

            <div class="container-fluid px-4 py-5">
                <div class="row g-4 justify-content-center">
                    <div class="col-lg-8">
                        <div class="card bg-glass border-0 shadow-sm p-4">

                            <!-- Controls -->
                            <div class="d-flex flex-wrap justify-content-center gap-3 mb-4">
                                <button class="btn btn-primary" id="startCam"><i
                                        class="fas fa-camera me-2"></i>Webcam</button>
                                <button class="btn btn-secondary"
                                    onclick="document.getElementById('uploadInput').click()"><i
                                        class="fas fa-upload me-2"></i>Subir Foto</button>
                                <input type="file" id="uploadInput" accept="image/*" hidden>
                                <button class="btn btn-success" id="downloadBtn"><i
                                        class="fas fa-download me-2"></i>Descargar Foto</button>
                            </div>

                            <!-- Canvas Area -->
                            <div id="canvas-container">
                                <canvas id="mainCanvas"></canvas>
                                <video id="videoElement" autoplay playsinline style="display:none;"></video>
                            </div>

                            <div class="mt-3 text-center text-muted small">
                                <p><i class="fas fa-info-circle me-1"></i> Arrastra la barra negra a los ojos y el
                                    cartel al pecho.</p>
                            </div>

                            <!-- Hidden assets for drawing -->
                            <div style="display: none;">
                                <img id="signImage" src="" alt="Sign"> <!-- We will draw this dynamically -->
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('videoElement');
        const sinnerNameInput = document.getElementById('sinnerName');
        const startCamBtn = document.getElementById('startCam');
        const uploadInput = document.getElementById('uploadInput');
        const downloadBtn = document.getElementById('downloadBtn');

        let currentImage = null;
        let isWebcamActive = false;

        // Draggable elements state
        let elements = [
            { type: 'bar', x: 50, y: 50, w: 200, h: 40, color: 'black', isDragging: false },
            { type: 'sign', x: 50, y: 150, w: 300, h: 200, isDragging: false } // Height will be dynamic based on text
        ];

        // Canvas Setup (default size)
        canvas.width = 640;
        canvas.height = 480;

        function draw() {
            // 1. Clear background
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Draw Base Image
            if (currentImage) {
                // Scale image to fit canvas while maintaining aspect ratio
                const scale = Math.min(canvas.width / currentImage.width, canvas.height / currentImage.height);
                const x = (canvas.width / 2) - (currentImage.width / 2) * scale;
                const y = (canvas.height / 2) - (currentImage.height / 2) * scale;
                ctx.drawImage(currentImage, x, y, currentImage.width * scale, currentImage.height * scale);
            } else if (isWebcamActive) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }

            // 3. Draw Elements (Censor Bar & Sign)
            elements.forEach(el => {
                if (el.type === 'bar') {
                    ctx.fillStyle = 'black';
                    ctx.fillRect(el.x, el.y, el.w, el.h);
                } else if (el.type === 'sign') {
                    drawSign(el);
                }
            });

            if (isWebcamActive) {
                requestAnimationFrame(draw);
            }
        }

        function drawSign(el) {
            const name = sinnerNameInput.value || "Bernat";
            const text = `Me llamo ${name},`;
            const subtext = "y me olvidé de poner el where en el delete from";

            ctx.fillStyle = 'white';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.fillRect(el.x, el.y, el.w, el.h);
            ctx.shadowBlur = 0; // Reset shadow

            // Border
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.strokeRect(el.x, el.y, el.w, el.h);

            // Text
            ctx.fillStyle = 'black';
            ctx.textAlign = 'center';

            // Name
            ctx.font = 'bold 20px "Marker Felt", "Comic Sans MS", sans-serif';
            ctx.fillText(text, el.x + el.w / 2, el.y + 40);

            // Statement
            ctx.font = '16px "Arial", sans-serif';
            wrapText(ctx, subtext, el.x + el.w / 2, el.y + 70, el.w - 20, 20);
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            var words = text.split(' ');
            var line = '';

            for (var n = 0; n < words.length; n++) {
                var testLine = line + words[n] + ' ';
                var metrics = context.measureText(testLine);
                var testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        // --- Interaction Logic (Drag & Drop) ---
        let dragTarget = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        function getMousePos(evt) {
            var rect = canvas.getBoundingClientRect();
            return {
                x: (evt.clientX - rect.left) * (canvas.width / rect.width),
                y: (evt.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            // Check elements in reverse order (to grab top-most first)
            for (let i = elements.length - 1; i >= 0; i--) {
                const el = elements[i];
                if (pos.x >= el.x && pos.x <= el.x + el.w && pos.y >= el.y && pos.y <= el.y + el.h) {
                    dragTarget = el;
                    dragOffsetX = pos.x - el.x;
                    dragOffsetY = pos.y - el.y;
                    break;
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (dragTarget) {
                const pos = getMousePos(e);
                dragTarget.x = pos.x - dragOffsetX;
                dragTarget.y = pos.y - dragOffsetY;
                if (!isWebcamActive) draw(); // Redraw if not in loop
            }
        });

        canvas.addEventListener('mouseup', () => {
            dragTarget = null;
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent("mousedown", {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }, false);
        canvas.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent("mousemove", {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }, false);
        canvas.addEventListener('touchend', (e) => {
            const mouseEvent = new MouseEvent("mouseup", {});
            canvas.dispatchEvent(mouseEvent);
        }, false);


        // --- Webcam Logic ---
        startCamBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                isWebcamActive = true;
                currentImage = null; // Clear static image
                draw(); // Start loop
            } catch (err) {
                console.error("Error accessing webcam:", err);
                alert("No se pudo acceder a la cámara. Asegúrate de dar permisos.");
            }
        });

        // --- Upload Logic ---
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        currentImage = img;
                        isWebcamActive = false; // Stop webcam loop
                        // Resize canvas to match image aspect mostly, but keep max width?
                        // For now keep standard canvas size to keep it simple or adjust:
                        // canvas.width = img.width; 
                        // canvas.height = img.height; 
                        // Update drag elements positions if needed
                        draw();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // --- Download Logic ---
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'confesion_sql.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        // --- Initial Draw ---
        draw(); // Draw black bg and elements

        // Redraw when name changes
        sinnerNameInput.addEventListener('input', () => {
            if (!isWebcamActive) draw();
        });

    </script>
</body>

</html>
