<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumnos — AprenderSQL Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/shared-admin.css">
<script src="/js/theme-switcher.js"></script>
</head>
<body>
<div class="admin-wrapper">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-page-title">
      <i class="fas fa-users text-primary"></i> Alumnos
    </div>
    <div class="admin-table-wrapper">
      <div class="admin-table-header">
        <h5><i class="fas fa-graduation-cap me-2 text-primary"></i>Todos los Alumnos</h5>
        <button class="btn btn-sm btn-outline-secondary" onclick="window._loadAlumnos()"><i class="fas fa-sync-alt"></i></button>
      </div>
      <div class="table-responsive">
        <table class="table table-dark table-sm mb-0 table-hover align-middle">
          <thead>
            <tr><th>#</th><th>Alumno</th><th>Clase</th><th>Puntos</th><th>Ejercicios</th><th>Última actividad</th></tr>
          </thead>
          <tbody id="alumnos-tbody">
            <tr><td colspan="6" class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin"></i></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/firebase-config.js"></script>
<script>window.FIREBASE_CONFIG = FIREBASE_CONFIG; window.APP_CONFIG = APP_CONFIG;</script>
<script type="module" src="js/alumnos.js"></script>
<script src="/js/load-footer.js"></script>
</body>
</html>
