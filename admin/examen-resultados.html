<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Resultados Examen — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../css/shared-admin.css">
  <script src="../js/theme-switcher.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; color: black !important; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
      .page-break { page-break-before: always; }
      .print-header { border-bottom: 2px solid black; margin-bottom: 20px; padding-bottom: 10px; }
      .print-q { margin-bottom: 15px; page-break-inside: avoid; }
      .print-opt { margin-left: 20px; }
    }
  </style>
</head>
<body class="bg-dark text-light">

<div class="admin-wrapper no-print">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <a href="#" id="back-link" class="btn btn-outline-secondary btn-sm mb-2"><i class="fas fa-arrow-left me-2"></i>Volver a la Clase</a>
        <h2 id="ex-title">Cargando...</h2>
        <p class="text-muted" id="ex-meta"></p>
      </div>
      <div>
        <button class="btn btn-primary" onclick="printExams()"><i class="fas fa-print me-2"></i>Imprimir Versión A/B (Papel)</button>
        <button class="btn btn-outline-success ms-2" id="btn-toggle-results" onclick="toggleResultados()">Publicar Notas a Alumnos</button>
      </div>
    </div>

    <!-- Resultados en Vivo -->
    <div class="card bg-black border-secondary mb-4">
      <div class="card-header bg-secondary bg-opacity-10 fw-bold border-secondary">
        <i class="fas fa-chart-line me-2 text-info"></i>Entregas de Alumnos
      </div>
      <div class="card-body p-0">
        <table class="table table-dark table-striped mb-0 text-center">
          <thead>
            <tr>
              <th class="text-start ps-4">Alumno</th>
              <th>Entregado el</th>
              <th>Resumen (A / E / B)</th>
              <th>Nota (10)</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="resultados-list">
            <tr><td colspan="4" class="py-4">Cargando entregas...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    
    <!-- Análisis Docente -->
    <div class="card bg-black border-secondary mb-4">
      <div class="card-header bg-secondary bg-opacity-10 fw-bold border-secondary">
        <i class="fas fa-microscope me-2 text-warning"></i>Análisis Docente
      </div>
      <div class="card-body row" id="analysis-container">
         <div class="col-12 py-3 text-center text-muted">Generando análisis...</div>
      </div>
    </div>
  </main>
</div>

<!-- Modal para ver examen del alumno -->
<div class="modal fade" id="modal-review-student" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content bg-dark text-white border-secondary">
      <div class="modal-header border-secondary bg-black">
        <h5 class="modal-title"><i class="fas fa-search me-2 text-info"></i>Revisión de <span id="review-student-name"></span></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="review-student-body">
        Cargando...
      </div>
    </div>
  </div>
</div>


  <!-- Contenedor Oculto para Impresión (se rellena dinámicamente) -->
  <div id="print-area" class="bg-white text-dark w-100" style="display: none; position: absolute; top:0; left:0; min-height: 100vh;"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, getDocs, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { initAdminPage, showAdminToast } from "./js/shared.js";

    let db;
    let examen = null;
    let bancoPreguntasCompleto = [];

    initAdminPage().then(async (fb) => {
      db = fb.db;
      const urlParams = new URLSearchParams(window.location.search);
      const exId = urlParams.get('id');
      if (!exId) return;

      const snap = await getDoc(doc(db, "examenes_test", exId));
      if(!snap.exists()) return;
      examen = { id: snap.id, ...snap.data() };
      
      document.getElementById('back-link').href = `clase.html?id=${examen.claseId}`;
      document.getElementById('ex-title').innerText = examen.titulo;
      document.getElementById('ex-meta').innerText = `${examen.preguntas.length} preguntas | ${examen.tiempoMinutos} min | Estado: ${examen.estado}`;

      if (examen.resultadosPublicados) {
        const btn = document.getElementById('btn-toggle-results');
        btn.classList.replace('btn-outline-success', 'btn-success');
        btn.innerText = 'Ocultar Notas a Alumnos';
      }

      // Cargar todas las preguntas completas (con correctas) para calcular notas y generar PDFs
      const qsSnap = await getDocs(query(collection(db, "preguntas")));
      bancoPreguntasCompleto = qsSnap.docs.map(d => ({id: d.id, ...d.data()}));

      loadEntregas();
    });

    let globalEntregas = [];
    let globalAlumnos = {};

    async function loadEntregas() {
      const q = query(collection(db, "respuestas_test"), where("examenId", "==", examen.id));
      const snap = await getDocs(q);
      
      const tbody = document.getElementById('resultados-list');
      if (snap.empty) {
        tbody.innerHTML = '<tr><td colspan="5" class="py-4">Nadie ha entregado todavía.</td></tr>';
        document.getElementById('analysis-container').innerHTML = '<div class="col-12 py-3 text-center text-muted">No hay datos suficientes para el análisis.</div>';
        return;
      }

      // Fetch users to show names
      const uIds = [];
      snap.forEach(d => { if(!uIds.includes(d.data().uid)) uIds.push(d.data().uid); });
      const uSnap = await getDocs(query(collection(db, "usuarios"), where("__name__", "in", uIds.length > 0 ? uIds : ['dummy'])));
      globalAlumnos = {};
      uSnap.forEach(d => globalAlumnos[d.id] = d.data());

      let html = '';
      globalEntregas = [];
      
      const qStats = {};
      examen.preguntas.forEach(p => {
         const fullQ = bancoPreguntasCompleto.find(x => x.id === p.id) || p;
         qStats[p.id] = { id: p.id, enunciado: fullQ.enunciado, criterio: fullQ.criterio || 'N/A', acertada: 0, fallada: 0, blanco: 0 };
      });

      snap.forEach(docSnap => {
        const d = docSnap.data();
        const al = globalAlumnos[d.uid] || { displayName: 'Desconocido', email: '' };
        globalEntregas.push({ id: docSnap.id, ...d });
        
        let aciertos = 0;
        let errores = 0;
        let blancas = 0;
        
        // Acumuladores por criterio: { criterio: { a, e, b, total } }
        const critStats = {};
        
        examen.preguntas.forEach(p => {
          const ansIdx = d.respuestas ? d.respuestas[p.id] : undefined;
          const origQ = bancoPreguntasCompleto.find(x => x.id === p.id);
          const crit = String(origQ?.criterio || p.criterio || 'N/A');
          
          if (!critStats[crit]) critStats[crit] = { a: 0, e: 0, b: 0, total: 0 };
          critStats[crit].total++;
          
          if (ansIdx === undefined) {
             blancas++;
             critStats[crit].b++;
             if (qStats[p.id]) qStats[p.id].blanco++;
          } else if (origQ && origQ.opciones[ansIdx] && origQ.opciones[ansIdx].correcta) {
             aciertos++;
             critStats[crit].a++;
             if (qStats[p.id]) qStats[p.id].acertada++;
          } else {
             errores++;
             critStats[crit].e++;
             if (qStats[p.id]) qStats[p.id].fallada++;
          }
        });
        
        // Nota global con penalización
        const penalizacion = errores / 3.0;
        const aciertosNetos = Math.max(0, aciertos - penalizacion);
        const nota = (aciertosNetos / examen.preguntas.length) * 10;
        const color = nota >= 5 ? 'text-success' : 'text-danger';
        const dateStr = d.entregadoEn ? d.entregadoEn.toDate().toLocaleString() : '-';

        // Calcular nota por criterio (misma fórmula de penalización al subconjunto)
        const notasCriterios = {};
        for (const crit in critStats) {
          const cs = critStats[crit];
          const pen = cs.e / 3.0;
          const netos = Math.max(0, cs.a - pen);
          notasCriterios[crit] = cs.total > 0 ? parseFloat(((netos / cs.total) * 10).toFixed(4)) : null;
        }

        // Guardar nota global y desglose por criterio
        const needsUpdate = d.nota !== nota || JSON.stringify(d.notasCriterios) !== JSON.stringify(notasCriterios);
        if (needsUpdate) {
          updateDoc(doc(db, "respuestas_test", docSnap.id), { nota, notasCriterios, examenId: examen.id, claseId: examen.claseId });
        }

        html += `
          <tr>
            <td class="text-start ps-4">
              <div class="fw-bold">${al.displayName}</div>
              <div class="small text-muted">${al.email}</div>
            </td>
            <td>${dateStr}</td>
            <td>
              <span class="text-success fw-bold" title="Aciertos">${aciertos}</span> / 
              <span class="text-danger fw-bold" title="Errores">${errores}</span> / 
              <span class="text-warning fw-bold" title="En blanco">${blancas}</span>
            </td>
            <td class="fw-bold fs-5 ${color}">${nota.toFixed(2)}</td>
            <td>
              <button class="btn btn-sm btn-outline-info" onclick="window.reviewStudent('${docSnap.id}')"><i class="fas fa-eye"></i> Revisar</button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
      
      // Render Analysis
      renderAnalysis(qStats);
    }
    
    function renderAnalysis(qStats) {
       const list = Object.values(qStats);
       if (list.length === 0) return;
       
       list.sort((a, b) => b.acertada - a.acertada);
       const maxAciertos = list[0];
       
       list.sort((a, b) => b.fallada - a.fallada);
       const maxFalladas = list[0];
       
       list.sort((a, b) => b.blanco - a.blanco);
       const maxBlancos = list[0];
       
       const container = document.getElementById('analysis-container');
       container.innerHTML = `
          <div class="col-md-4 mb-3">
             <div class="card bg-dark border-success h-100">
               <div class="card-header bg-success text-white fw-bold"><i class="fas fa-star me-2"></i>Más Acertada</div>
               <div class="card-body">
                 <p class="small text-light">${maxAciertos.enunciado}</p>
                 <div class="badge bg-success">${maxAciertos.acertada} aciertos</div>
               </div>
             </div>
          </div>
          <div class="col-md-4 mb-3">
             <div class="card bg-dark border-danger h-100">
               <div class="card-header bg-danger text-white fw-bold"><i class="fas fa-times-circle me-2"></i>Más Fallada</div>
               <div class="card-body">
                 <p class="small text-light">${maxFalladas.enunciado}</p>
                 <div class="badge bg-danger">${maxFalladas.fallada} fallos</div>
               </div>
             </div>
          </div>
          <div class="col-md-4 mb-3">
             <div class="card bg-dark border-warning h-100">
               <div class="card-header bg-warning text-dark fw-bold"><i class="fas fa-ban me-2"></i>Más en Blanco</div>
               <div class="card-body">
                 <p class="small text-light">${maxBlancos.enunciado}</p>
                 <div class="badge bg-warning text-dark">${maxBlancos.blanco} blancos</div>
               </div>
             </div>
          </div>
          <div class="col-12 mt-4">
            <h6 class="text-info border-bottom border-secondary pb-2 mb-3">Detalle por Pregunta</h6>
            <div class="table-responsive">
              <table class="table table-dark table-sm table-striped">
                <thead>
                  <tr>
                    <th>#</th>
                    <th class="w-50">Pregunta</th>
                    <th>Criterio</th>
                    <th class="text-center text-success">Aciertos</th>
                    <th class="text-center text-danger">Fallos</th>
                    <th class="text-center text-warning">Blancos</th>
                  </tr>
                </thead>
                <tbody>
                  ${examen.preguntas.map((p, i) => {
                     const st = qStats[p.id];
                     if (!st) return '';
                     return `
                       <tr>
                         <td>${i + 1}</td>
                         <td class="small text-truncate" style="max-width:300px;" title="${st.enunciado}">${st.enunciado}</td>
                         <td><span class="badge bg-secondary">${st.criterio}</span></td>
                         <td class="text-center text-success fw-bold">${st.acertada}</td>
                         <td class="text-center text-danger fw-bold">${st.fallada}</td>
                         <td class="text-center text-warning fw-bold">${st.blanco}</td>
                       </tr>
                     `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
       `;
    }
    
    window.reviewStudent = (respuestaId) => {
       const entrega = globalEntregas.find(e => e.id === respuestaId);
       if (!entrega) return;
       const al = globalAlumnos[entrega.uid];
       document.getElementById('review-student-name').innerText = al ? al.displayName : 'Alumno';
       
       let reviewHtml = '';
       examen.preguntas.forEach((q, idx) => {
          const studentAnsIdx = entrega.respuestas ? entrega.respuestas[q.id] : undefined;
          const origQ = bancoPreguntasCompleto.find(x => x.id === q.id) || q;
          const correctOrigIdx = origQ.opciones.findIndex(o => o.correcta);
          
          const isCorrect = studentAnsIdx === correctOrigIdx;
          const noAnswer = studentAnsIdx === undefined;
          
          let headerColor = isCorrect ? 'text-success' : (noAnswer ? 'text-warning' : 'text-danger');
          let headerIcon = isCorrect ? 'fa-check' : (noAnswer ? 'fa-minus' : 'fa-times');
          let blankBadge = noAnswer ? '<span class="badge bg-warning text-dark ms-2"><i class="fas fa-ban me-1"></i>En blanco</span>' : '';
          
          reviewHtml += `<div class="card bg-black border-secondary mb-3">
            <div class="card-header border-secondary ${headerColor} py-2">
              <strong>${idx + 1}.</strong>${blankBadge} ${q.enunciado}
            </div>
            <div class="card-body py-2">`;
            
          origQ.opciones.forEach((opt, optIdx) => {
             let badge = '';
             let textClass = 'text-secondary';
             if (optIdx === correctOrigIdx) {
               badge = '<span class="badge bg-success ms-2">Correcta</span>';
               textClass = 'text-success fw-bold';
             } else if (optIdx === studentAnsIdx) {
               badge = '<span class="badge bg-danger ms-2">Marcada</span>';
               textClass = 'text-danger fw-bold';
             }
             reviewHtml += `<div class="mb-1 small ${textClass}"><i class="fas fa-circle ms-2 me-2" style="font-size:6px;"></i> ${opt.texto} ${badge}</div>`;
          });
          
          reviewHtml += `</div></div>`;
       });
       
       document.getElementById('review-student-body').innerHTML = reviewHtml;
       new bootstrap.Modal(document.getElementById('modal-review-student')).show();
    };
    window.toggleResultados = async () => {
      const nuevoVal = !examen.resultadosPublicados;
      const updateData = { resultadosPublicados: nuevoVal };
      
      if (nuevoVal) {
        const correcciones = {};
        examen.preguntas.forEach(p => {
           const bq = bancoPreguntasCompleto.find(x => x.id === p.id);
           if (bq) {
             const correctIdx = bq.opciones.findIndex(o => o.correcta);
             if(correctIdx !== -1) correcciones[p.id] = correctIdx;
           }
        });
        updateData.correcciones = correcciones;
      }
      
      await updateDoc(doc(db, "examenes_test", examen.id), updateData);
      examen.resultadosPublicados = nuevoVal;
      showAdminToast(nuevoVal ? 'Notas publicadas' : 'Notas ocultadas', 'success');
      
      const btn = document.getElementById('btn-toggle-results');
      if (nuevoVal) {
        btn.classList.replace('btn-outline-success', 'btn-success');
        btn.innerText = 'Ocultar Notas a Alumnos';
      } else {
        btn.classList.replace('btn-success', 'btn-outline-success');
        btn.innerText = 'Publicar Notas a Alumnos';
      }
    };

    window.printExams = () => {
      const printArea = document.getElementById('print-area');
      
      // Mapear preguntas del examen con sus datos completos
      const qsExamen = examen.preguntas.map(pInfo => bancoPreguntasCompleto.find(bq => bq.id === pInfo.id)).filter(Boolean);

      const htmlA = renderExamenPapel(qsExamen, 'A', 'Versión A');
      
      // Para la B: barajamos preguntas y opciones
      const qsB = JSON.parse(JSON.stringify(qsExamen)).sort(() => Math.random() - 0.5);
      qsB.forEach(q => q.opciones.sort(() => Math.random() - 0.5));
      
      const htmlB = renderExamenPapel(qsB, 'B', 'Versión B');

      printArea.innerHTML = htmlA + '<div class="page-break"></div>' + htmlB;
      printArea.style.display = 'block';
      window.print();
      printArea.style.display = 'none';
    };

    function renderExamenPapel(preguntas, version, tituloExtra) {
      let h = `
        <div class="p-4 bg-white" style="font-family: sans-serif;">
          <div class="print-header">
            <h3>${examen.titulo} — ${tituloExtra}</h3>
            <div style="margin-top: 15px; font-size: 1.1em;">
              <strong>Nombre y Apellidos:</strong> _______________________________________________________ 
              <span style="float:right"><strong>Nota:</strong> _____ / 10</span>
            </div>
          </div>
          <div style="margin-top:20px;">
      `;

      preguntas.forEach((q, idx) => {
        h += `<div class="print-q">
          <strong>${idx+1}. ${q.enunciado}</strong>
          <div style="margin-top: 5px;">
        `;
        q.opciones.forEach((opt, oIdx) => {
          h += `<div class="print-opt">O ${opt.texto}</div>`; // O actua como radio (un circulo)
        });
        h += `</div></div>`;
      });

      h += `</div></div>`;
      return h;
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script>window.FIREBASE_CONFIG = FIREBASE_CONFIG; window.APP_CONFIG = APP_CONFIG;</script>
</body>
</html>
