<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Clases — AprenderSQL Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/shared-admin.css">
</head>
<body>
<div class="admin-wrapper">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">

    <div class="admin-page-title">
      <i class="fas fa-chalkboard-teacher text-success"></i> Gestión de Clases
    </div>

    <!-- Crear clase -->
    <div class="admin-table-wrapper mb-4">
      <div class="admin-table-header">
        <h5><i class="fas fa-plus-circle me-2 text-success"></i>Nueva Clase</h5>
      </div>
      <div class="p-3">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label text-secondary small">Nombre de la clase</label>
            <input type="text" id="clase-nombre" class="form-control dark-input" placeholder="Ej: 1º ASIR GBD — Tarde">
          </div>
          <div class="col-md-3">
            <label class="form-label text-secondary small">Curso / Año</label>
            <input type="text" id="clase-curso" class="form-control dark-input" placeholder="Ej: 2025-2026">
          </div>
          <div class="col-md-3">
            <label class="form-label text-secondary small">Módulo</label>
            <select id="clase-modulo" class="form-select dark-input">
              <option value="0372">0372 — Gestión de BD (1º ASIR)</option>
              <option value="0377">0377 — Administración SGBD (2º ASIR)</option>
            </select>
          </div>
          <div class="col-md-2 d-flex flex-column gap-2">
            <button class="btn btn-success w-100" onclick="window._createClase()">
              <i class="fas fa-plus me-2"></i>Crear
            </button>
            <button class="btn btn-outline-warning w-100" onclick="window._startClassroomImport()"
                    style="border-color:#f59e0b;color:#f59e0b;font-size:0.82rem">
              <i class="fab fa-google me-1"></i>Classroom
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Lista de clases -->
    <div class="admin-table-wrapper">
      <div class="admin-table-header">
        <h5><i class="fas fa-list me-2"></i>Clases Existentes</h5>
        <button class="btn btn-sm btn-outline-secondary" onclick="window._loadClases()">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
      <div class="table-responsive">
        <table class="table table-dark table-sm mb-0 table-hover">
          <thead>
            <tr><th>Nombre</th><th>Módulo</th><th>Curso</th><th>Docente</th><th>Alumnos</th><th>Acciones</th></tr>
          </thead>
          <tbody id="clases-tbody">
            <tr><td colspan="6" class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin"></i></td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- Modal Classroom -->
<div class="modal fade" id="classroom-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header border-bottom border-warning">
        <h5 class="modal-title text-warning"><i class="fab fa-google me-2"></i>Cursos de Google Classroom</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small">Selecciona el curso que deseas importar.</p>
        <div id="classroom-courses-list" class="list-group list-group-flush bg-transparent">
          <div class="text-center py-4 text-muted"><i class="fas fa-spinner fa-spin"></i> Cargando...</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/firebase-config.js"></script>
<script>window.FIREBASE_CONFIG = FIREBASE_CONFIG; window.APP_CONFIG = APP_CONFIG;</script>
<script type="module" src="js/clases.js"></script>
</body>
</html>
