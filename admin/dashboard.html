<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — AprenderSQL Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/shared-admin.css">
<script src="../js/theme-switcher.js"></script>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>
<div class="admin-wrapper">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">

    <div class="admin-page-title d-flex justify-content-between align-items-center">
      <div><i class="fas fa-chart-line text-primary"></i> Dashboard</div>
      <button class="btn btn-warning fw-bold shadow-sm" id="btn-sync-medallas" title="Otorga retroactivamente las medallas basadas en el progreso actual a todos los alumnos">
        <i class="fas fa-sync-alt me-2"></i>Sincronizar Medallas Globales
      </button>
    </div>

    <!-- Stats -->
    <div class="stat-grid">
      <div class="stat-card primary">
        <div class="stat-label"><i class="fas fa-users me-1"></i>Alumnos</div>
        <div class="stat-value" id="stat-alumnos">—</div>
      </div>
      <div class="stat-card success">
        <div class="stat-label"><i class="fas fa-chalkboard me-1"></i>Clases</div>
        <div class="stat-value" id="stat-clases">—</div>
      </div>
      <div class="stat-card warning">
        <div class="stat-label"><i class="fas fa-user-tie me-1"></i>Docentes</div>
        <div class="stat-value" id="stat-docentes">—</div>
      </div>
      <div class="stat-card accent">
        <div class="stat-label"><i class="fas fa-dumbbell me-1"></i>Ejercicios</div>
        <div class="stat-value" id="stat-ejercicios">—</div>
      </div>
    </div>

    <div class="row g-4">
      <!-- Últimos intentos -->
      <div class="col-lg-7">
        <div class="admin-table-wrapper">
          <div class="admin-table-header">
            <h5><i class="fas fa-history me-2 text-info"></i>Últimos Intentos</h5>
          </div>
          <div class="table-responsive">
            <table class="table table-dark table-sm mb-0">
              <thead>
                <tr><th>Alumno</th><th>Ejercicio</th><th>Resultado</th><th>Pts</th><th>Fecha</th></tr>
              </thead>
              <tbody id="dash-intentos-tbody">
                <tr><td colspan="5" class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin"></i></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Ranking -->
      <div class="col-lg-5">
        <div class="admin-table-wrapper">
          <div class="admin-table-header">
            <h5><i class="fas fa-trophy me-2 text-warning"></i>Ranking Alumnos</h5>
          </div>
          <div class="table-responsive">
            <table class="table table-dark table-sm mb-0">
              <thead>
                <tr><th>#</th><th>Alumno</th><th>Puntos</th><th>Ej.</th></tr>
              </thead>
              <tbody id="dash-ranking-tbody">
                <tr><td colspan="4" class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin"></i></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>


  </main>
</div>

<!-- Modal Sincronizando Medallas -->
<div class="modal fade" id="modal-sync" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white border-warning">
      <div class="modal-header border-bottom border-warning">
        <h5 class="modal-title text-warning"><i class="fas fa-sync-alt fa-spin me-2"></i>Sincronizando Medallas</h5>
      </div>
      <div class="modal-body p-4 text-center">
        <h6 class="mb-3" id="sync-status-text">Iniciando escaneo...</h6>
        <div class="progress mb-3" style="height: 20px; background:#1e293b">
          <div id="sync-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-warning text-dark fw-bold" style="width: 0%">0%</div>
        </div>
        <div id="sync-log" class="text-start p-2 rounded bg-black small text-secondary font-monospace" style="height: 150px; overflow-y: auto;">
          <!-- Logs go here -->
        </div>
      </div>
      <div class="modal-footer border-top border-warning" style="display:none;" id="sync-footer">
        <button type="button" class="btn btn-warning mx-auto" data-bs-dismiss="modal">Finalizar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/ejercicios-data.js"></script>
<script>window.FIREBASE_CONFIG = FIREBASE_CONFIG; window.APP_CONFIG = APP_CONFIG;</script>
<script type="module" src="js/dashboard.js"></script>
<script src="../js/load-footer.js"></script>
</body>
</html>
