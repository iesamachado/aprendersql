<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temario de Clase — AprenderSQL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/task-shared.css">
<script src="/js/theme-switcher.js"></script>
</head>
<body class="task-body">

<nav class="task-navbar">
  <div class="brand cursor-pointer" onclick="window.location.href='clases.html'">
    <i class="fas fa-arrow-left me-2 text-secondary hover-white"></i>
    <div class="icon"><i class="fas fa-database"></i></div>
    <span class="fw-bold d-none d-sm-inline">AprenderSQL</span>
  </div>
  <div class="d-flex align-items-center gap-3">
    <div class="points-badge">
      <i class="fas fa-star text-warning"></i> <span id="user-points">0</span> pts
    </div>
    <div class="user-profile dropdown">
      <div class="d-flex align-items-center gap-2 cursor-pointer" data-bs-toggle="dropdown">
        <span class="text-sm fw-medium d-none d-sm-block text-secondary" id="user-name">Usuario</span>
        <img src="" alt="avatar" id="user-avatar" style="width:32px;height:32px;border-radius:50%;background:#1e293b">
      </div>
      <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark shadow">
        <li><a class="dropdown-item" href="clases.html"><i class="fas fa-home me-2"></i>Mis Clases</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="#" id="btn-logout"><i class="fas fa-sign-out-alt me-2"></i>Cerrar sesión</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-end mb-4">
    <div>
      <div class="text-secondary small mb-1">Temario de la clase</div>
      <h4 class="text-white fw-bold mb-0" id="tanda-clase-nombre">Cargando...</h4>
    </div>
  </div>

  <div class="row g-4" id="tandas-container">
    <div class="col-12 text-center py-5">
      <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/ejercicios-data.js"></script>
<script>window.FIREBASE_CONFIG = FIREBASE_CONFIG; window.APP_CONFIG = APP_CONFIG;</script>
<script type="module" src="js/tandas.js"></script>
<script src="/js/load-footer.js"></script>
</body>
</html>
