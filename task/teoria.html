<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teoría — AprenderSQL</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS Original theory and task layout -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/task-shared.css">
  
  <style>
    /* Adjust specific styles for theory viewer inside task area */
    body {
        background-color: #020617; /* matches task-body */
    }
    .teoria-container {
        max-width: 900px;
        margin: 0 auto;
        padding-bottom: 100px;
    }
    
    @media print {
      body { background-color: white !important; color: black !important; }
      nav, #btn-volver-tandas, .btn-outline-light { display: none !important; }
      .bg-dark, .card, .bg-glass { background-color: white !important; border: 1px solid #ccc !important; box-shadow: none !important; }
      .text-white, .text-light, .text-secondary, .text-muted { color: black !important; }
      .text-primary, .text-info, .text-warning, .text-success, .text-danger { color: #333 !important; }
      .teoria-container { max-width: 100%; padding: 0; margin: 0; }
      pre, code { color: black !important; border: 1px solid #eee; }
    }
  </style>
</head>
<body class="task-body">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-3" style="height:60px">
  <div class="d-flex align-items-center me-auto">
    <button class="btn btn-sm btn-outline-secondary me-3" id="btn-volver-tandas">
      <i class="fas fa-arrow-left"></i> Volver
    </button>
    <span class="navbar-brand mb-0 h1 fs-5 me-auto">
      <i class="fas fa-book-open text-primary me-2"></i>
      <span id="header-bloque-nombre">Cargando Teoría...</span>
    </span>
  </div>
  <div>
    <button class="btn btn-sm btn-outline-light" onclick="window.imprimirTema()">
      <i class="fas fa-print me-1"></i> Imprimir
    </button>
</nav>

<div class="container-fluid py-4 teoria-container" id="main-content">
    <div id="teoria-wrapper">
        <div class="text-center py-5">
            <i class="fas fa-spinner fa-spin fa-3x text-primary"></i>
            <p class="mt-3 text-secondary">Cargando contenido...</p>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/ejercicios-data.js"></script>
<script>
  window.FIREBASE_CONFIG = FIREBASE_CONFIG; 
  window.APP_CONFIG = APP_CONFIG;
</script>

<!-- Includes interactive logic from the original tutorial -->
<script src="../js/main.js"></script>

<script type="module" src="js/teoria.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.4.0/dist/mermaid.min.js"></script>
<script>mermaid.initialize({ startOnLoad: true, theme: "dark" });</script>
</body>
</html>
