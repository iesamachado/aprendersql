<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Alumnos — AprenderSQL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/task-shared.css">
</head>
<body class="task-body">

<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <i class="fas fa-database text-white fs-3"></i>
    </div>
    <h1 class="h3 mb-2 fw-bold text-white">AprenderSQL</h1>
    <p class="text-secondary mb-4 small">Plataforma de ejercicios interactivos SQL. Inicia sesión con tu cuenta de instituto.</p>
    
    <button class="btn-google mb-4" id="btn-google-login">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Acceder con Google
    </button>
    
    <div class="alert alert-info py-2 small mb-0 text-start">
      <i class="fas fa-info-circle me-1"></i>
      Tu docente debe asignarte a una clase para poder ver los ejercicios.
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/firebase-config.js"></script>
<script>window.FIREBASE_CONFIG = FIREBASE_CONFIG; window.APP_CONFIG = APP_CONFIG;</script>
<script type="module">
  import { initFirebase } from '../js/shared-firebase.js';

  const fb = await initFirebase();

  fb.onAuthStateChanged(fb.auth, async (user) => {
    if (!user) return; // Esperar login
    const snap = await fb.getDoc(fb.doc(fb.db, 'usuarios', user.uid));
    
    if (snap.exists() && ['admin','docente'].includes(snap.data().rol)) {
      window.location.href = '../admin/dashboard.html';
    } else if (!snap.exists()) {
      // Registrar nuevo alumno
      try {
        const pending = await fb.getDocs(
          fb.query(fb.collection(fb.db, 'usuarios_pendientes'), fb.where('email','==', user.email))
        );
        const rol = (!pending.empty) ? 'docente' : 'alumno';
        
        await fb.setDoc(fb.doc(fb.db, 'usuarios', user.uid), {
          nombre: user.displayName, email: user.email, foto: user.photoURL,
          rol: rol, createdAt: fb.serverTimestamp()
        });
        
        if (rol === 'docente') window.location.href = '../admin/dashboard.html';
        else window.location.href = 'clases.html';
      } catch(e) { console.error('Error creando usuario:', e); }
    } else {
      window.location.href = 'clases.html';
    }
  });

  document.getElementById('btn-google-login').addEventListener('click', async () => {
    const provider = new fb.GoogleAuthProvider();
    try { await fb.signInWithPopup(fb.auth, provider); }
    catch(e) { console.error(e); }
  });
</script>
<script src="/js/load-footer.js"></script>
</body>
</html>
